<style>
:root{
  --bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--bg4:#252525;
  --border:#2a2a2a;--border2:#333;
  --text:#f0f0f0;--text2:#999;--text3:#555;
  --green:#4ade80;--green-dim:#1a3d28;
  --blue:#60a5fa;--blue-dim:#1a2d4a;
  --amber:#fbbf24;--amber-dim:#3d2e08;
  --red:#f87171;--red-dim:#3d1414;
  --radius:10px;--radius-lg:14px;
}
body.light{
  --bg:#f5f5f5;--bg2:#ffffff;--bg3:#efefef;--bg4:#e5e5e5;
  --border:#e0e0e0;--border2:#d0d0d0;
  --text:#111111;--text2:#555555;--text3:#aaaaaa;

}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:640px;margin:0 auto;padding:0 0 80px}
body[data-tab="elim"] .app{max-width:none}
.topbar{background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px}
.topbar-logo{font-size:20px}

.topbar-sub{font-size:10px;color:var(--text2);margin-top:1px}
.topbar-right{margin-left:auto;display:flex;gap:5px;align-items:center}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100}
.bnav-btn{flex:1;padding:10px 4px 8px;border:none;background:transparent;color:var(--text2);font-family:inherit;font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s}
.bnav-btn.active{color:var(--green)}
.bnav-icon{font-size:19px;line-height:1}
.section{display:none;padding:16px}.section.active{display:block}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:8px}
.group-hdr{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.group-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
.group-hdr:first-child{margin-top:0}
.match-meta{font-size:10px;color:var(--text3);margin-bottom:6px}
.match-row{display:flex;align-items:center;gap:8px}
.team{flex:1;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.r{text-align:right}
.score-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0}
.score-wrap input{width:36px;height:32px;text-align:center;font-size:15px;font-weight:600;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:inherit;-moz-appearance:textfield}
.score-wrap input::-webkit-inner-spin-button,.score-wrap input::-webkit-outer-spin-button{-webkit-appearance:none}
.score-wrap input:focus{outline:none;border-color:var(--green)}
.sep{color:var(--text3);font-size:12px}
.badge{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:600;flex-shrink:0}
.b-exact{background:var(--green-dim);color:var(--green)}
.b-res{background:var(--blue-dim);color:var(--blue)}
.b-miss{background:var(--red-dim);color:var(--red)}
.legend{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.legend-item{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:10px;color:var(--text2)}
.legend-item strong{color:var(--text)}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
select{height:34px;padding:0 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:inherit;font-size:12px;cursor:pointer}
select:focus{outline:none;border-color:var(--green)}
.btn{padding:8px 14px;border:1px solid var(--border2);border-radius:8px;background:transparent;cursor:pointer;font-size:13px;color:var(--text);font-family:inherit;transition:background .15s}
.btn:hover{background:var(--bg3)}
.btn-primary{background:var(--green);color:#000;border-color:transparent;font-weight:600}
.btn-primary:hover{opacity:.9}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-danger{color:var(--red);border-color:transparent}
.btn-danger:hover{background:var(--red-dim)}
.rank-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.rank-row:last-child{border-bottom:none}
.rank-num{font-size:16px;font-weight:700;width:22px;text-align:center;color:var(--text3)}
.rank-num.gold{color:#BA7517}.rank-num.silver{color:#aaa}.rank-num.bronze{color:#cd7f32}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.rank-name{flex:1;font-size:13px;font-weight:500}
.rank-sub{font-size:10px;color:var(--text3);margin-top:2px}
.rank-pts{font-size:19px;font-weight:700;color:var(--green)}
.rank-pts-lbl{font-size:10px;color:var(--text3);text-align:right}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:var(--bg3);border-radius:10px;padding:12px;text-align:center}
.stat-val{font-size:22px;font-weight:700}
.stat-lbl{font-size:10px;color:var(--text2);margin-top:2px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:500}
.form-group input{width:100%;height:38px;padding:0 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px}

.auth-box{max-width:360px;margin:40px auto;padding:0 16px}
.auth-box h1{font-size:26px;font-weight:700;margin-bottom:4px;letter-spacing:-.03em}
.auth-box p{font-size:13px;color:var(--text2);margin-bottom:24px}
.auth-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--bg3);padding:3px;border-radius:8px}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 16px;font-size:12px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.err{border-color:var(--red);color:var(--red)}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}
.note{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:11px;color:var(--text2);margin-bottom:14px;line-height:1.5}
.atabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.atab{padding:6px 12px;border:1px solid var(--border2);border-radius:20px;background:transparent;cursor:pointer;font-size:11px;color:var(--text2);font-family:inherit}
.atab.active{background:var(--green);color:#000;border-color:transparent;font-weight:600}
.prog-bar{height:3px;background:var(--bg4);border-radius:2px;margin-top:5px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:2px}
.player-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.add-row{display:flex;gap:8px;margin-top:14px}
.add-row input{flex:1;height:36px;padding:0 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:40px;color:var(--text3)}
.elim-head{padding-right:16px}
#tab-elim.section{padding-right:0}
.bracket-scroll{overflow:hidden;padding:2px 16px 22px 0;overscroll-behavior-x:none;touch-action:pan-y}
.bracket-board{display:flex;gap:44px;align-items:flex-start;min-width:max-content;transform:translateX(calc(-1 * var(--bracket-shift, 0px)));transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.bracket-round{--col-w:280px;--card-h:112px;position:relative;width:var(--col-w);flex:0 0 var(--col-w)}
.bracket-titlebar{height:30px;display:grid;grid-template-columns:32px minmax(0,1fr) 32px;align-items:center;gap:4px}
.bracket-title{width:100%;height:30px;border:none;background:transparent;font-size:13px;font-weight:700;color:var(--text2);display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;font-family:inherit;cursor:pointer;border-radius:8px;transition:color .15s,background .15s}
.bracket-title:hover{background:var(--bg3);color:var(--text)}
.bracket-round.is-active .bracket-title{color:var(--green)}
.bracket-nav{width:32px;height:30px;border:1px solid var(--border2);border-radius:8px;background:var(--bg2);color:var(--text);font-size:20px;line-height:1;font-family:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .16s,background .16s,border-color .16s,color .16s}
.bracket-nav:hover{background:var(--bg3);border-color:var(--green-dim);color:var(--green)}
.bracket-nav:disabled{opacity:0;cursor:default}
.bracket-round.is-active .bracket-nav{opacity:1;pointer-events:auto}
.bracket-round.is-active .bracket-nav:disabled{opacity:.22;pointer-events:none}
.bracket-stack{position:relative;height:calc(var(--slot) * var(--matches))}
.bracket-card{position:absolute;top:calc((var(--slot) * var(--idx)) + ((var(--slot) - var(--card-h)) / 2));left:0;width:100%;height:var(--card-h);margin:0;border-radius:8px;padding:12px;background:var(--bg2);border-color:var(--border2);display:flex;flex-direction:column;justify-content:center;gap:8px;transform-origin:center;transition:top .34s ease,height .34s ease,width .34s ease,padding .34s ease,opacity .22s ease,transform .34s ease,border-color .22s ease,box-shadow .22s ease}
.bracket-round.is-collapsing .bracket-card,.bracket-round.is-before .bracket-card{top:calc((var(--slot) * ((var(--pair) * 2) + 1)) + (var(--side) * 44px) - 37px);width:100%;height:30px;padding:0 12px;opacity:.82;gap:0}
.bracket-round.is-after .bracket-card{opacity:.72}
.bracket-card.merge-target{border-color:var(--green);box-shadow:0 0 0 1px var(--green-dim)}
.bracket-card.is-final{border-color:var(--green)}
.bracket-meta{font-size:10px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:8px;min-height:14px}
.bracket-meta .badge{margin-left:auto}
.bracket-team{display:grid;grid-template-columns:minmax(0,1fr) 34px;align-items:center;gap:8px}
.bracket-team-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bracket-summary{display:none;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bracket-round.is-collapsing .bracket-meta,.bracket-round.is-before .bracket-meta,.bracket-round.is-collapsing .bracket-team,.bracket-round.is-before .bracket-team{display:none}
.bracket-round.is-collapsing .bracket-summary,.bracket-round.is-before .bracket-summary{display:block}
.bracket-team input{width:34px;height:28px;text-align:center;font-size:14px;font-weight:700;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:inherit;-moz-appearance:textfield}
.bracket-team input::-webkit-inner-spin-button,.bracket-team input::-webkit-outer-spin-button{-webkit-appearance:none}
.bracket-team input:focus{outline:none;border-color:var(--green)}
.bracket-connector{position:absolute;left:100%;top:calc(var(--slot) * ((var(--pair) * 2) + .5));width:44px;height:var(--slot);pointer-events:none;color:var(--border2)}
.bracket-connector span{position:absolute;background:currentColor}
.bracket-connector .c-top{left:0;top:0;width:22px;height:1px}
.bracket-connector .c-bottom{left:0;bottom:0;width:22px;height:1px}
.bracket-connector .c-vert{left:22px;top:0;width:1px;height:100%}
.bracket-connector .c-mid{left:22px;top:50%;width:22px;height:1px}
.bracket-round.is-before .bracket-connector,.bracket-round.is-collapsing .bracket-connector{left:100%;top:calc((var(--slot) * ((var(--pair) * 2) + 1)) - 22px);width:44px;height:44px;opacity:.58}
.third-place{max-width:280px;margin-top:18px}
@media(max-width:720px){
  body[data-tab="elim"] .topbar{position:sticky}
  #tab-elim.section{padding-left:12px}
  .bracket-round{--col-w:246px;--card-h:106px}
  .bracket-titlebar{grid-template-columns:30px minmax(0,1fr) 30px;gap:3px}
  .bracket-nav{width:30px}
  .bracket-board{gap:34px}
  .bracket-connector{width:34px}
  .bracket-connector .c-top,.bracket-connector .c-bottom{width:17px}
  .bracket-connector .c-vert{left:17px}
  .bracket-connector .c-mid{left:17px;width:17px}
}
</style>
</head>

// ─── LOCK ─────────────────────────────────────────────────────────────────────
function isLocked(match){
  if(!match||!match.iso)return false;
  const kickoff=new Date(match.iso+':00-04:00');
  return new Date()>=(kickoff.getTime()-60*1000);
}

function lockPredictionInput(inp){
  inp.disabled=true;
  inp.style.opacity='0.4';
  if(document.activeElement===inp)inp.blur();
}

function guardPredictionFocus(inp){
  const match=MATCHES.find(m=>m.id===inp.dataset.mid);
  if(!match||!isLocked(match))return;
  lockPredictionInput(inp);
  showToast(t('already_started'),'err');
  refreshLocks();
}

function refreshLocks(){
  const activeTab=document.querySelector('.bnav-btn.active');
  if(!activeTab||activeTab.dataset.tab!=='fixture')return;
  document.querySelectorAll('.card').forEach(card=>{
    const inp=card.querySelector('input[data-mid]');
    if(!inp)return;
    const match=MATCHES.find(m=>m.id===inp.dataset.mid);
    if(!match)return;
    const locked=isLocked(match);
    card.querySelectorAll('input').forEach(i=>{
      if(locked){
        lockPredictionInput(i);
      }else{
        i.disabled=false;
        i.style.opacity='1';
      }
    });
    const meta=card.querySelector('.match-meta');
    if(meta)meta.textContent=`${match.date} ${match.time}hs · ${t('group_lbl')} ${match.group}${locked?' 🔒':''}`;
  });
}
setInterval(refreshLocks,15000);

// ─── UTILS ────────────────────────────────────────────────────────────────────
function getResult(h,a){const hi=parseInt(h),ai=parseInt(a);if(isNaN(hi)||isNaN(ai))return null;return hi>ai?'1':hi<ai?'2':'X';}
function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function colorIdx(uid){const i=allProfiles.findIndex(p=>p.id===uid);return i<0?0:i%AVATARS.length;}
function matchDateSortValue(date){const[d,m]=date.split('/').map(Number);return new Date(2026,m-1,d).getTime();}
function todayMatchDate(){
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Santiago',day:'2-digit',month:'2-digit'}).formatToParts(new Date());
  const day=parts.find(p=>p.type==='day')?.value||'01';
  const month=parts.find(p=>p.type==='month')?.value||'01';
  return `${day}/${month}`;
}
function compareMatchDatesByTimeline(a,b){
  const today=matchDateSortValue(todayMatchDate());
  const av=matchDateSortValue(a),bv=matchDateSortValue(b);
  const aPast=av<today,bPast=bv<today;
  if(aPast!==bPast)return aPast?1:-1;
  return av-bv;
}
function isPastMatchDate(date){return matchDateSortValue(date)<matchDateSortValue(todayMatchDate());}
function sortedMatchDates(){return [...new Set(MATCHES.map(m=>m.date))].sort(compareMatchDatesByTimeline);}
let toastT;
function showToast(msg,type='ok'){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+(type==='err'?'err':'ok');clearTimeout(toastT);toastT=setTimeout(()=>el.className='toast',2500);}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function roundLabel(round){return ROUND_LABELS[lang]?.[round.id]||round.label;}
function elimExactText(round){return lang==='es'?`+${round.pe} exacto ${roundLabel(round)}`:`+${round.pe} exact ${roundLabel(round)}`;}
function elimBadge(round,pred,real){
  if(!real||pred.h===null||pred.a===null||real.h===null||real.a===null)return '';
  const pr=getResult(pred.h,pred.a),rr=getResult(real.h,real.a);
  if(pred.h==real.h&&pred.a==real.a)return `<span class="badge b-exact">+${round.pe}</span>`;
  if(pr===rr)return `<span class="badge b-res">+${round.pr}</span>`;
  return `<span class="badge b-miss">✗</span>`;
}

function calcPoints(uid){
  let pts=0,exact=0,res=0,miss=0;
  const preds=allPredictions[uid]||{};
  MATCHES.forEach(m=>{
    const pred=preds[m.id];const real=results[m.id];
    if(!pred||!real||pred.h===null||pred.a===null||real.h===null||real.a===null)return;
    const pr=getResult(pred.h,pred.a),rr=getResult(real.h,real.a);
    if(!pr||!rr)return;
    if(pred.h==real.h&&pred.a==real.a){pts+=3;exact++;}
    else if(pr===rr){pts+=1;res++;}
    else miss++;
  });
  const elimPreds=allElimPreds[uid]||{};
  ELIM_ROUNDS.forEach(round=>{
    for(let i=0;i<round.matches;i++){
      const mid=`${round.id}_${i}`;
      const pred=elimPreds[mid];const real=elimResults[mid];
      if(!pred||!real||pred.h===null||pred.a===null||real.h===null||real.a===null)return;
      const pr=getResult(pred.h,pred.a),rr=getResult(real.h,real.a);
      if(!pr||!rr)return;
      if(pred.h==real.h&&pred.a==real.a){pts+=round.pe;exact++;}
      else if(pr===rr){pts+=round.pr;res++;}
      else miss++;
    }
  });
  return{pts,exact,result:res,miss};
}

async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const password=document.getElementById('login-password').value;
  if(!email||!password){showToast('Completá todos los campos','err');return;}
  const btn=document.getElementById('login-btn');
  btn.innerHTML='<span class="spinner"></span>';btn.disabled=true;
  const{error}=await sb.auth.signInWithPassword({email,password});
  btn.textContent=t('enter');btn.disabled=false;
  if(error){showToast(error.message==='Invalid login credentials'?'Email o contraseña incorrectos':error.message,'err');return;}
}

async function doRegister(){
  const name=document.getElementById('reg-name').value.trim();
  const email=document.getElementById('reg-email').value.trim();
  const password=document.getElementById('reg-password').value;
  if(!name||!email||!password){showToast('Completá todos los campos','err');return;}
  if(password.length<6){showToast('La contraseña debe tener al menos 6 caracteres','err');return;}
  const btn=document.getElementById('reg-btn');
  btn.innerHTML='<span class="spinner"></span>';btn.disabled=true;
  const{data,error}=await sb.auth.signUp({email,password,options:{data:{name}}});
  btn.textContent=t('create');btn.disabled=false;
  if(error){showToast(error.message,'err');return;}
  if(data.user){
    // Create profile
    await sb.from('profiles').upsert({id:data.user.id,name,is_admin:false});
    showToast('¡Cuenta creada! Revisá tu email para confirmar.');
  }
}

async function doLogout(){
  await sb.auth.signOut();
  currentUser=null;currentProfile=null;isAdmin=false;
  document.getElementById('main-app').style.display='none';
  document.getElementById('auth-screen').style.display='block';
}

// ─── LOAD DATA ────────────────────────────────────────────────────────────────
async function fetchAllRows(tableOrQuery,select='*'){
  const pageSize=1000;
  let from=0;
  let rows=[];
  const getQuery=typeof tableOrQuery==='function'
    ? tableOrQuery
    : ()=>sb.from(tableOrQuery).select(select);
  while(true){
    const{data,error}=await getQuery().range(from,from+pageSize-1);
    if(error){
      throw error;
    }
    rows=rows.concat(data||[]);
    if(!data||data.length<pageSize)break;
    from+=pageSize;
  }
  return rows;
}

function buildPredictionMaps(predictions,elimPredictions){
  allPredictions={};
  [...predictions].sort((a,b)=>new Date(a.updated_at||0)-new Date(b.updated_at||0)).forEach(r=>{
    if(!allPredictions[r.user_id])allPredictions[r.user_id]={};
    allPredictions[r.user_id][r.match_id]={h:r.home_score,a:r.away_score};
  });
  allElimPreds={};
  [...elimPredictions].sort((a,b)=>new Date(a.updated_at||0)-new Date(b.updated_at||0)).forEach(r=>{
    if(!allElimPreds[r.user_id])allElimPreds[r.user_id]={};
    allElimPreds[r.user_id][r.match_id]={h:r.home_score,a:r.away_score};
  });
}

function buildResultsMaps(groupResults,knockoutResults,knockoutTeams){
  results={};
  groupResults.forEach(r=>{results[r.match_id]={h:r.home_score,a:r.away_score};});
  elimResults={};
  knockoutResults.forEach(r=>{elimResults[r.match_id]={h:r.home_score,a:r.away_score};});
  elimTeams={};
  knockoutTeams.forEach(r=>{elimTeams[r.match_id]={home:r.home_team,away:r.away_team};});
}

async function loadUserData(){
  try{
    const[predictions,elimPredictions,groupResults,knockoutResults,knockoutTeams]=await Promise.all([
      fetchAllRows(()=>sb.from('predictions').select('*').eq('user_id',currentUser.id)),

      fetchAllRows('results'),
      fetchAllRows('elim_results'),
      fetchAllRows('elim_teams'),

async function loadRankingData(force=false){

// ─── SAVE PREDICTION ──────────────────────────────────────────────────────────
function scheduleSavePred(inp){
  const key=`${inp.dataset.mid}:${inp.dataset.side}`;
  clearTimeout(predictionSaveTimers[key]);
  predictionSaveTimers[key]=setTimeout(()=>savePred(inp),500);
}

function flushSavePred(inp){
  const key=`${inp.dataset.mid}:${inp.dataset.side}`;
  clearTimeout(predictionSaveTimers[key]);
  delete predictionSaveTimers[key];
  savePred(inp);
}

async function savePred(inp){
  const mid=inp.dataset.mid,side=inp.dataset.side;
  const val=inp.value.trim();
  // Don't save if empty
  if(val===''||val===null)return;
  const numVal=parseInt(val);
  if(isNaN(numVal)||numVal<0)return;
  const match=MATCHES.find(m=>m.id===mid);
  if(match&&isLocked(match)){
    lockPredictionInput(inp);
    showToast(t('already_started'),'err');
    refreshLocks();return;
  }
  // Optimistic update
  if(!allPredictions[currentUser.id])allPredictions[currentUser.id]={};
  if(!allPredictions[currentUser.id][mid])allPredictions[currentUser.id][mid]={h:null,a:null};
  allPredictions[currentUser.id][mid][side]=numVal;
  updateBadge(inp.closest('.card'),mid,currentUser.id);
  // Save to Supabase — first check if row exists, then update or insert
  const pred=allPredictions[currentUser.id][mid];
  const{data:existing,error:selectError}=await sb.from('predictions').select('id').eq('user_id',currentUser.id).eq('match_id',mid).limit(1);
  if(selectError){showSaveError(selectError);return;}
  let error;
  if(existing&&existing.length){
    ({error}=await sb.from('predictions').update({
      home_score:pred.h,
      away_score:pred.a,
      updated_at:new Date().toISOString()
    }).eq('user_id',currentUser.id).eq('match_id',mid));
  }else{
    ({error}=await sb.from('predictions').insert({
      user_id:currentUser.id,
      match_id:mid,
      home_score:pred.h,
      away_score:pred.a,
      updated_at:new Date().toISOString()
    }));
  }
  if(error){showSaveError(error);return;}
  showToast(t('saved'));
}

async function saveElimPred(inp){
  const mid=inp.dataset.mid,side=inp.dataset.side;
  const val=inp.value.trim();
  if(val===''||val===null)return;
  const numVal=parseInt(val);
  if(isNaN(numVal)||numVal<0)return;
  if(!allElimPreds[currentUser.id])allElimPreds[currentUser.id]={};
  if(!allElimPreds[currentUser.id][mid])allElimPreds[currentUser.id][mid]={h:null,a:null};
  allElimPreds[currentUser.id][mid][side]=numVal;
  const pred=allElimPreds[currentUser.id][mid];
  const{data:existingElim}=await sb.from('elim_predictions').select('id').eq('user_id',currentUser.id).eq('match_id',mid).maybeSingle();
  if(existingElim){
    await sb.from('elim_predictions').update({home_score:pred.h,away_score:pred.a,updated_at:new Date().toISOString()}).eq('user_id',currentUser.id).eq('match_id',mid);
  }else{
    await sb.from('elim_predictions').insert({user_id:currentUser.id,match_id:mid,home_score:pred.h,away_score:pred.a,updated_at:new Date().toISOString()});
  }
  showToast(t('saved'));
}

function updateBadge(card,mid,uid){
  if(!card)return;
  const pred=allPredictions[uid]?.[mid];
  const real=results[mid];
  let badge='';
  if(real&&pred&&pred.h!==null&&pred.a!==null&&real.h!==null&&real.a!==null){
    const pr=getResult(pred.h,pred.a),rr=getResult(real.h,real.a);
    if(pred.h==real.h&&pred.a==real.a)badge=`<span class="badge b-exact">+3</span>`;
    else if(pr===rr)badge=`<span class="badge b-res">+1</span>`;
    else badge=`<span class="badge b-miss">✗</span>`;
  }
  const ex=card.querySelector('.badge');if(ex)ex.remove();
  if(badge)card.querySelector('.match-row').insertAdjacentHTML('beforeend',badge);
}

// ─── ELIMINATORIA ─────────────────────────────────────────────────────────────
function renderElim(){
  const el=document.getElementById('tab-elim');
  const mainRounds=ELIM_ROUNDS.filter(r=>r.id!=='tp');
  const matchCard=(round,i,roundIdx,extraClass='')=>{
    const mid=`${round.id}_${i}`;
    const pred=allElimPreds[currentUser.id]?.[mid]||{h:null,a:null};
    const real=elimResults[mid];
    const teams=elimTeams[mid]||{home:t('to_define'),away:t('to_define')};
    const home=teams.home||t('to_define'),away=teams.away||t('to_define');
    const badge=elimBadge(round,pred,real);
    const compact=`${home} / ${away}`;
    return`<div class="card bracket-card ${extraClass}" style="--idx:${i};--pair:${Math.floor(i/2)};--side:${i%2}" data-round-index="${roundIdx}" data-match-index="${i}">
      <div class="bracket-summary">${esc(compact)}</div>
      <div class="bracket-meta">${esc(roundLabel(round))} · ${t('match')} ${i+1}${badge}</div>
      <label class="bracket-team">
        <span class="bracket-team-name">${esc(home)}</span>
        <input type="number" min="0" max="20" value="${pred.h!==null?esc(pred.h):''}" placeholder="?"
          data-mid="${mid}" data-side="h" onblur="saveElimPred(this)">
      </label>
      <label class="bracket-team">
        <span class="bracket-team-name">${esc(away)}</span>
        <input type="number" min="0" max="20" value="${pred.a!==null?esc(pred.a):''}" placeholder="?"
          data-mid="${mid}" data-side="a" onblur="saveElimPred(this)">
      </label>
    </div>`;
  };
  let html=`<div class="elim-head"><div class="legend">`;
  mainRounds.forEach(r=>{html+=`<span class="legend-item"><strong>+${r.pe}</strong> ${esc(elimExactText(r)).replace(`+${r.pe} `,'')}</span>`;});
  html+=`</div><div class="note">${t('elim_note')}</div></div><div class="bracket-scroll"><div class="bracket-board">`;
  mainRounds.forEach((round,ri)=>{
    const slot=elimRoundSlot(ri);
    const stateClass=ri<elimActiveRound?'is-before':ri===elimActiveRound?'is-active':'is-after';
    const prevDisabled=ri===0?'disabled':'';
    const nextDisabled=ri===mainRounds.length-1?'disabled':'';
    html+=`<section class="bracket-round ${stateClass}" data-round-index="${ri}" style="--slot:${slot}px;--matches:${round.matches}">
      <div class="bracket-titlebar">
        <button class="bracket-nav bracket-nav-prev" type="button" ${prevDisabled} aria-label="${lang==='es'?'Ronda anterior':'Previous round'}" onclick="moveBracketRound(-1)">&lsaquo;</button>
        <button class="bracket-title" type="button" onclick="handleBracketRoundClick(${ri})">${esc(roundLabel(round))}</button>
        <button class="bracket-nav bracket-nav-next" type="button" ${nextDisabled} aria-label="${lang==='es'?'Ronda siguiente':'Next round'}" onclick="moveBracketRound(1)">&rsaquo;</button>
      </div>
      <div class="bracket-stack">`;
    for(let i=0;i<round.matches;i++)html+=matchCard(round,i,ri,round.id==='final'?'is-final':'');
    if(ri<mainRounds.length-1){
      const pairs=mainRounds[ri+1].matches;
      for(let p=0;p<pairs;p++){
        html+=`<div class="bracket-connector" style="--pair:${p}"><span class="c-top"></span><span class="c-bottom"></span><span class="c-vert"></span><span class="c-mid"></span></div>`;
      }
    }
    html+=`</div></section>`;
  });
  html+=`</div></div>`;
  const thirdPlace=ELIM_ROUNDS.find(r=>r.id==='tp');
  if(thirdPlace){
    html+=`<div class="third-place">
      <div class="group-hdr">${esc(roundLabel(thirdPlace))}</div>
      <div style="position:relative;height:112px;--slot:112px;--matches:1">${matchCard(thirdPlace,0,mainRounds.length)}</div>
    </div>`;
  }
  el.innerHTML=html;
  requestAnimationFrame(()=>{
    updateBracketSlots();
    updateBracketShift();
  });
}

function elimRoundSlot(idx){
  const delta=idx-elimActiveRound;
  if(delta>=0)return ELIM_BASE_SLOT*Math.pow(2,delta);
  return Math.max(24,ELIM_BASE_SLOT/Math.pow(2,Math.abs(delta)));
}

function updateBracketSlots(){
  document.querySelectorAll('#tab-elim .bracket-round').forEach(round=>{
    const idx=parseInt(round.dataset.roundIndex,10);
    round.style.setProperty('--slot',`${elimRoundSlot(idx)}px`);
  });
}

function updateBracketShift(){
  const scroller=document.querySelector('#tab-elim .bracket-scroll');
  const board=document.querySelector('#tab-elim .bracket-board');
  const round=document.querySelector(`#tab-elim .bracket-round[data-round-index="${elimActiveRound}"]`);
  if(!scroller||!board||!round)return;
  scroller.scrollLeft=0;
  board.style.setProperty('--bracket-shift',`${Math.max(0,round.offsetLeft)}px`);
}

function applyBracketFocus(){
  document.querySelectorAll('#tab-elim .bracket-round').forEach(round=>{
    const idx=parseInt(round.dataset.roundIndex,10);
    round.classList.toggle('is-before',idx<elimActiveRound);
    round.classList.toggle('is-active',idx===elimActiveRound);
    round.classList.toggle('is-after',idx>elimActiveRound);
  });
  updateBracketSlots();
  updateBracketShift();
}

async function animateRoundAdvance(fromIdx,toIdx){
  const fromRound=document.querySelector(`#tab-elim .bracket-round[data-round-index="${fromIdx}"]`);
  const toCards=[...document.querySelectorAll(`#tab-elim .bracket-card[data-round-index="${toIdx}"]`)];
  if(!fromRound||!toCards.length)return;
  fromRound.classList.add('is-collapsing');
  elimActiveRound=toIdx;
  requestAnimationFrame(()=>{
    applyBracketFocus();
  });
  if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){
    fromRound.classList.remove('is-collapsing');
    return;
  }
  await new Promise(resolve=>setTimeout(resolve,120));
  toCards.forEach(target=>{
    target.classList.add('merge-target');
  });
  await new Promise(resolve=>setTimeout(resolve,360));
  toCards.forEach(target=>target.classList.remove('merge-target'));
  fromRound.classList.remove('is-collapsing');
}

async function handleBracketRoundClick(idx){
  if(idx===elimActiveRound)return;
  const previous=elimActiveRound;
  if(idx>previous){
    for(let step=previous+1;step<=idx;step++){
      await animateRoundAdvance(step-1,step);
    }
    return;
  }
  elimActiveRound=idx;
  applyBracketFocus();
}

function moveBracketRound(delta){
  const maxIdx=ELIM_ROUNDS.filter(r=>r.id!=='tp').length-1;
  const nextIdx=Math.max(0,Math.min(maxIdx,elimActiveRound+delta));
  handleBracketRoundClick(nextIdx);
}

function renderAdminElim(){
  let html='';
  ELIM_ROUNDS.forEach(round=>{
    html+=`<div class="group-hdr">${round.label}</div>`;
    for(let i=0;i<round.matches;i++){
      const mid=`${round.id}_${i}`;
      const r=elimResults[mid];
      const teams=elimTeams[mid]||{home:t('to_define'),away:t('to_define')};
      const fh=FLAGS[teams.home]||'',fa=FLAGS[teams.away]||'';
      html+=`<div class="card">
        <div class="match-meta">${round.label} · ${t('match')} ${i+1}</div>
        <div class="match-row">
          <span class="team" style="font-size:11px">${fh} ${teams.home}</span>
          <div class="score-wrap">
            <input type="number" min="0" max="20" value="${r&&r.h!==null?r.h:''}" placeholder="?"
              data-mid="${mid}" data-side="h" onchange="saveElimResult(this)" ${isAdmin?'':'disabled'}>
            <span class="sep">-</span>
            <input type="number" min="0" max="20" value="${r&&r.a!==null?r.a:''}" placeholder="?"
              data-mid="${mid}" data-side="a" onchange="saveElimResult(this)" ${isAdmin?'':'disabled'}>
          </div>
          <span class="team r" style="font-size:11px">${teams.away} ${fa}</span>
        </div>
      </div>`;
    }
  });
  document.getElementById('admin-body').innerHTML=html;
}

function renderAdminTeams(){
  let html=`<p style="font-size:11px;color:var(--text3);margin-bottom:12px">Completá los equipos a medida que se definen los cruces.</p>`;
  ELIM_ROUNDS.forEach(round=>{
    html+=`<div class="group-hdr">${round.label}</div>`;
    for(let i=0;i<round.matches;i++){
      const mid=`${round.id}_${i}`;
      const teams=elimTeams[mid]||{home:'',away:''};
      html+=`<div class="card">
        <div class="match-meta">${round.label} · ${t('match')} ${i+1}</div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
          <input type="text" value="${teams.home}" placeholder="${t('to_define')}" maxlength="20"
            style="flex:1;height:30px;padding:0 8px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:inherit;font-size:11px"
            data-mid="${mid}" data-side="home" onchange="saveElimTeam(this)" ${isAdmin?'':'disabled'}>
          <span style="color:var(--text3);font-size:11px">vs</span>
          <input type="text" value="${teams.away}" placeholder="${t('to_define')}" maxlength="20"
            style="flex:1;height:30px;padding:0 8px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:inherit;font-size:11px"
            data-mid="${mid}" data-side="away" onchange="saveElimTeam(this)" ${isAdmin?'':'disabled'}>
        </div>
      </div>`;
    }
  });
  document.getElementById('admin-body').innerHTML=html;
}

function renderAdminPlayers(){
  let html='';
  allProfiles.forEach((p,i)=>{
    const ci=i%AVATARS.length;
    const filled=Object.keys(allPredictions[p.id]||{}).filter(k=>{const pr=allPredictions[p.id][k];return pr.h!==null&&pr.a!==null;}).length;
    const pct=Math.round(filled/MATCHES.length*100);
    html+=`<div class="player-row">
      <div class="avatar" style="background:${AVATARS[ci]};color:${AVATAR_COLORS[ci]}">${initials(p.name)}</div>
      <div style="flex:1">
        <div style="display:flex;justify-content:space-between">
          <span style="font-size:13px;font-weight:500">${p.name}${p.is_admin?' ⚙️':''}</span>
          <span style="font-size:10px;color:var(--text3)">${filled}/${MATCHES.length}</span>
        </div>
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`;
  });
  if(!html)html='<div class="empty">No hay jugadores</div>';
  document.getElementById('admin-body').innerHTML=html;
}

async function saveSingleMatchRecord(table, mid, payload){
  const now=new Date().toISOString();
  const row={match_id:mid,...payload};
  if(table!=='elim_teams')row.updated_at=now;

  const{data:existing,error:selectError}=await sb
    .from(table)
    .select('match_id')
    .eq('match_id',mid)
    .limit(1);
  if(selectError)return selectError;

  if(existing&&existing.length){
    const{error}=await sb.from(table).update(row).eq('match_id',mid);
    return error;
  }

  const{error}=await sb.from(table).insert(row);
  return error;
}

function showSaveError(error){
  console.error('Save failed:',error);
  showToast(error?.message||'No se pudo guardar','err');
}

async function saveResult(inp){
  if(!isAdmin){showToast(t('admin_only'),'err');return;}
  const mid=inp.dataset.mid,side=inp.dataset.side,val=parseInt(inp.value);
  if(!results[mid])results[mid]={h:null,a:null};
  results[mid][side]=isNaN(val)?null:val;
  const r=results[mid];
  const error=await saveSingleMatchRecord('results',mid,{home_score:r.h,away_score:r.a});
  if(error){showSaveError(error);return;}
  showToast(t('saved'));
}

async function saveElimResult(inp){
  if(!isAdmin){showToast(t('admin_only'),'err');return;}
  const mid=inp.dataset.mid,side=inp.dataset.side,val=parseInt(inp.value);
  if(!elimResults[mid])elimResults[mid]={h:null,a:null};
  elimResults[mid][side]=isNaN(val)?null:val;
  const r=elimResults[mid];
  const error=await saveSingleMatchRecord('elim_results',mid,{home_score:r.h,away_score:r.a});
  if(error){showSaveError(error);return;}
  showToast(t('saved'));
}

async function saveElimTeam(inp){
  if(!isAdmin)return;
  const mid=inp.dataset.mid,side=inp.dataset.side,val=inp.value;
  if(!elimTeams[mid])elimTeams[mid]={home:'',away:''};
  elimTeams[mid][side]=val;
  const tm=elimTeams[mid];
  const error=await saveSingleMatchRecord('elim_teams',mid,{home_team:tm.home,away_team:tm.away});
  if(error)showSaveError(error);
}

const renders={fixture:renderFixture,elim:renderElim,ranking:renderRanking,admin:renderAdmin};

// ─── INIT ─────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',async()=>{
  applyTheme();
  document.body.dataset.tab='fixture';
  document.getElementById('lang-btn').textContent=lang==='es'?'EN':'ES';
  document.getElementById('auth-lang-btn').textContent=lang==='es'?'EN':'ES';

  sb.auth.onAuthStateChange(async(event,session)=>{
    if(session?.user){
      currentUser=session.user;
      // Load profile
      const{data:profData,error:profErr}=await sb.from('profiles').select('*').eq('id',currentUser.id);
      let prof=profData&&profData.length>0?profData[0]:null;
      if(!prof){
        // Create profile from metadata
        const name=currentUser.user_metadata?.name||currentUser.email.split('@')[0];
        const{data:newProf}=await sb.from('profiles').upsert({id:currentUser.id,name,is_admin:false},{onConflict:'id'}).select().single();
        currentProfile=newProf||{id:currentUser.id,name,is_admin:false};
      }else{
        currentProfile=prof;
      }
      isAdmin=currentProfile?.is_admin===true;
      document.getElementById('auth-screen').style.display='none';
      document.getElementById('main-app').style.display='block';
      document.getElementById('topbar-player').textContent=currentProfile?.name||currentUser.email;
      document.getElementById('topbar-title').textContent=t('title');
      document.querySelector('.nav-groups').textContent=t('groups');
      document.querySelector('.nav-elim').textContent=t('elim');
      document.getElementById('logout-btn').textContent=t('logout');
      await loadUserData();
      renderFixture();
    }else{
      document.getElementById('main-app').style.display='none';
      document.getElementById('auth-screen').style.display='block';
      updateAuthUI();
    }
  });
});
</script>
